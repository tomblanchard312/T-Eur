name: Package Build Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'sdk/**'
      - 'iso20022-adapter/**'
      - '.github/workflows/dependency-hygiene.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'sdk/**'
      - 'iso20022-adapter/**'
      - '.github/workflows/dependency-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build and test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - dashboard
          - sdk
          - iso20022-adapter
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --run
