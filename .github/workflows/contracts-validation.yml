name: Contracts Build and Validation

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-validation.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-validation.yml'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      - name: Run unit and fuzz tests
        run: forge test -vvv

      - name: Run invariant suite
        run: forge test --match-contract TokenizedEuroInvariantTest -vvv
        env:
          FOUNDRY_PROFILE: ci
